<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Velox Browser Extension — UI Kit</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="page-mock" data-screen-label="Velox Extension">
    <div class="video-mock">
      <span class="frame-label">on a YouTube watch page</span>
      <h1>How to make croissants — 100% from scratch (4K)</h1>
      <div class="channel">Cooking with Reza · 412K subscribers</div>
      <div class="desc-line"></div>
      <div class="desc-line"></div>
      <div class="desc-line"></div>
      <div class="desc-line"></div>
      <div id="pill-host"></div>
    </div>
    <div class="popup-frame">
      <span class="frame-label right">toolbar popup</span>
      <div id="popup-host"></div>
    </div>
  </div>

  <script type="text/babel" src="InPagePill.jsx"></script>
  <script type="text/babel" src="Popup.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById("pill-host")).render(<window.InPagePill defaultOpen={true} />);
    ReactDOM.createRoot(document.getElementById("popup-host")).render(<window.Popup />);
  </script>
</body>
</html>
