<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0c1220;font-family:var(--velox-font-sans);color:var(--velox-text);overflow:hidden;height:100vh}
  body{padding:14px 18px;box-sizing:border-box}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(60% 50% at 8% 0%,rgba(108,196,255,.10),transparent 60%);pointer-events:none}
  .label{font:600 10px/1 var(--velox-font-sans);text-transform:uppercase;letter-spacing:.08em;color:var(--velox-text-dim);margin-bottom:10px;position:relative}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
  .pill{display:flex;align-items:center;gap:10px;padding:14px 14px;border-radius:10px;font:500 13px/1.1 var(--velox-font-sans)}
  .dot{width:10px;height:10px;border-radius:50%}
  .hex{margin-left:auto;font:500 11px/1 var(--velox-font-mono);opacity:.85}
  .success{background:rgba(110,231,163,.10);color:#6ee7a3;box-shadow:inset 0 0 0 1px rgba(110,231,163,.3)}
  .danger{background:rgba(255,122,138,.10);color:#ff7a8a;box-shadow:inset 0 0 0 1px rgba(255,122,138,.3)}
  .warning{background:linear-gradient(135deg,rgba(252,211,77,.15),rgba(252,211,77,.05));color:#fcd34d;box-shadow:inset 0 0 0 1px rgba(252,211,77,.35)}
</style>
</head><body>
  <div class="label">Semantic states</div>
  <div class="row">
    <div class="pill success"><span class="dot" style="background:#6ee7a3"></span>Done<span class="hex">#6EE7A3</span></div>
    <div class="pill warning"><span class="dot" style="background:#fcd34d"></span>Paused<span class="hex">#FCD34D</span></div>
    <div class="pill danger"><span class="dot" style="background:#ff7a8a"></span>Failed<span class="hex">#FF7A8A</span></div>
  </div>
</body></html>
