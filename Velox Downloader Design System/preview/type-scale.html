<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0c1220;font-family:var(--velox-font-sans);color:var(--velox-text);overflow:hidden;height:100vh}
  body{padding:18px 22px;box-sizing:border-box}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(60% 50% at 8% 0%,rgba(108,196,255,.10),transparent 60%);pointer-events:none}
  .stack{display:flex;flex-direction:column;gap:14px;position:relative}
  .specimen{display:flex;align-items:baseline;gap:14px}
  .tok{font:500 11px/1 var(--velox-font-mono);color:var(--velox-text-faint);width:130px;flex-shrink:0}
  .h1{font:600 22px/1 var(--velox-font-sans)}
  .h2{font:600 18px/1 var(--velox-font-sans)}
  .h3{font:600 15px/1 var(--velox-font-sans)}
  .body{font:400 14px/1 var(--velox-font-sans)}
  .label{font:500 12px/1 var(--velox-font-sans);color:var(--velox-text-dim)}
  .eyebrow{font:600 12px/1 var(--velox-font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--velox-text-dim)}
</style>
</head><body>
  <div class="stack">
    <div class="specimen"><div class="tok">--velox-t-h1</div><div class="h1">New Download</div></div>
    <div class="specimen"><div class="tok">--velox-t-h2</div><div class="h2">Active Downloads</div></div>
    <div class="specimen"><div class="tok">--velox-t-h3</div><div class="h3">Velox Downloader v2.1</div></div>
    <div class="specimen"><div class="tok">--velox-t-body</div><div class="body">Paste a URL above to start.</div></div>
    <div class="specimen"><div class="tok">--velox-t-label</div><div class="label">Paste Video URL</div></div>
    <div class="specimen"><div class="tok">--velox-t-eyebrow</div><div class="eyebrow">Format &amp; codec</div></div>
  </div>
</body></html>
