<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0c1220;font-family:var(--velox-font-sans);color:var(--velox-text);overflow:hidden;height:100vh}
  body{padding:18px 22px;box-sizing:border-box;display:grid;grid-template-columns:repeat(7,1fr);gap:14px;align-items:center}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(60% 50% at 8% 0%,rgba(108,196,255,.10),transparent 60%);pointer-events:none}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
  .icon{width:42px;height:42px;border-radius:10px;background:rgba(20,24,36,.85);border:1px solid rgba(255,255,255,.08);color:#98a2b3;display:grid;place-items:center}
  .icon svg{width:22px;height:22px}
  .nm{font:500 10px/1 var(--velox-font-mono);color:var(--velox-text-faint);text-align:center}
</style>
</head><body>
  <div class="cell"><div class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7v10l10 5 10-5V7L12 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 10l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="nm">logo</div></div>
  <div class="cell"><div class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="currentColor" stroke-width="1.6"/></svg></div><div class="nm">folder</div></div>
  <div class="cell"><div class="icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" stroke="currentColor" stroke-width="1.6"/></svg></div><div class="nm">globe</div></div>

</body></html>
