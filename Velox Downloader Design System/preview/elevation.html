<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0c1220;font-family:var(--velox-font-sans);color:var(--velox-text);overflow:hidden;height:100vh}
  body{padding:24px 22px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(60% 50% at 8% 0%,rgba(108,196,255,.10),transparent 60%);pointer-events:none}
  .slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .box{width:90px;height:64px;border-radius:14px;background:rgba(28,32,44,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .box.card{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 6px 24px rgba(0,0,0,.4)}
  .box.btn{background:linear-gradient(135deg,#6cc4ff,#4ea8ff);box-shadow:0 4px 16px rgba(108,196,255,.35)}
  .box.logo{background:linear-gradient(135deg,#4ea8ff,#a78bfa);box-shadow:0 4px 12px rgba(78,168,255,.40)}
  .box.menu{background:rgba(28,32,44,.98);box-shadow:0 16px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.05)}
  .box.glow{background:rgba(20,24,36,.85);box-shadow:0 0 20px rgba(108,196,255,.35),inset 0 0 0 1px rgba(108,196,255,.4)}
  .tok{font:500 11px/1 var(--velox-font-mono);color:var(--velox-text-dim);text-align:center}
  .role{font:600 11px/1 var(--velox-font-sans);color:var(--velox-text);text-align:center}
</style>
</head>
<body>
  <div class="slot"><div class="box card"></div><div><div class="role">card</div><div class="tok">0 6 24 / .18</div></div></div>
  <div class="slot"><div class="box btn"></div><div><div class="role">btn (cyan)</div><div class="tok">0 4 16 / .35</div></div></div>
  <div class="slot"><div class="box logo"></div><div><div class="role">logo</div><div class="tok">0 4 12 / .40</div></div></div>
  <div class="slot"><div class="box menu"></div><div><div class="role">menu</div><div class="tok">0 16 40 / .60</div></div></div>
  <div class="slot"><div class="box glow"></div><div><div class="role">accent glow</div><div class="tok">0 0 20 / .35</div></div></div>
  <div class="slot"><div class="box" style="background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)"></div><div><div class="role">inset ring</div><div class="tok">inset 0 0 0 1 / .14</div></div></div>
</body></html>
