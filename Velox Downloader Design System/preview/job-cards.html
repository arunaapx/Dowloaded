<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0c1220;font-family:var(--velox-font-sans);color:var(--velox-text);overflow:hidden;height:100vh}
  body{padding:14px 16px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(60% 50% at 8% 0%,rgba(108,196,255,.10),transparent 60%);pointer-events:none}
  .job{background:rgba(28,32,44,.72);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;backdrop-filter:blur(24px);box-shadow:0 6px 24px rgba(0,0,0,.4);position:relative}
  .body{display:flex;gap:12px;padding:12px}
  .thumb{width:92px;height:64px;border-radius:8px;background:linear-gradient(135deg,#2a3145,#1a1f30);position:relative;flex-shrink:0;display:grid;place-items:center;color:#6b7280}
  .badge{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;font:600 11px/1 var(--velox-font-sans);padding:2px 6px;border-radius:4px}
  .info{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .hdr{display:flex;justify-content:space-between;gap:8px}
  .title{font:600 13px/1.2 var(--velox-font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .state{font:400 12px/1 var(--velox-font-sans);color:#98a2b3;flex-shrink:0}
  .state.done{color:#6ee7a3}
  .bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#6cc4ff,#4ea8ff);box-shadow:0 0 8px rgba(108,196,255,.4)}
  .meta{display:flex;justify-content:space-between;font:400 12px/1 var(--velox-font-sans);color:#98a2b3}
  .ctrl{display:flex;align-items:center;gap:4px;padding:6px 12px;border-top:1px solid rgba(255,255,255,.08);background:rgba(36,40,54,.65)}
  .ctrl-lbl{font:500 12px/1 var(--velox-font-sans);color:#98a2b3;margin-right:auto}
  .cb{background:transparent;border:0;color:#98a2b3;padding:6px 10px;border-radius:6px;font:400 12px/1 var(--velox-font-sans);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .cb svg{width:13px;height:13px}
  .done .fill{background:linear-gradient(90deg,#6ee7a3,#4ade80)}
</style>
</head><body>
  <div class="job">
    <div class="body">
      <div class="thumb"><span class="badge">1080P</span><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6"/><path d="M10 9l5 3-5 3V9z" fill="currentColor"/></svg></div>
      <div class="info">
        <div class="hdr"><span class="title">Big Buck Bunny — Trailer (HD)</span><span class="state">62%</span></div>
        <div class="bar"><div class="fill" style="width:62%"></div></div>
        <div class="meta"><span>14.2 MB / 22.9 MB</span><span>3.4 MiB/s · ETA 00:02</span></div>
      </div>
    </div>
    <div class="ctrl">
      <span class="ctrl-lbl">Controls</span>
      <button class="cb"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>Pause</button>
      <button class="cb" style="color:#ff7a8a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>Cancel</button>
    </div>
  </div>
  <div class="job done">
    <div class="body">
      <div class="thumb" style="background:linear-gradient(135deg,#1d3a2b,#0f1f17)"><span class="badge">MP3</span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6ee7a3" stroke-width="1.6"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M9 18V6l12-2v12"/></svg></div>
      <div class="info">
        <div class="hdr"><span class="title">Lo-Fi Beats to Code To</span><span class="state done">Done</span></div>
        <div class="bar"><div class="fill" style="width:100%"></div></div>
        <div class="meta"><span>5.8 MB</span><span>192 kbps · MP3</span></div>
      </div>
    </div>
    <div class="ctrl">
      <span class="ctrl-lbl">Controls</span>
      <button class="cb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>Open Folder</button>
    </div>
  </div>
</body></html>
