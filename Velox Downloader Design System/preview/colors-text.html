<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0c1220;font-family:var(--velox-font-sans);color:var(--velox-text);overflow:hidden;height:100vh}
  body{padding:14px 18px;box-sizing:border-box}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(60% 50% at 8% 0%,rgba(108,196,255,.10),transparent 60%);pointer-events:none}
  .label{font:600 10px/1 var(--velox-font-sans);text-transform:uppercase;letter-spacing:.08em;color:var(--velox-text-dim);margin-bottom:10px;position:relative}
  .stack{display:flex;flex-direction:column;gap:10px;position:relative}
  .row{display:flex;align-items:center;gap:14px}
  .swatch{width:64px;height:46px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);flex-shrink:0}
  .role{font:600 13px/1.1 var(--velox-font-sans)}
  .desc{font:400 12px/1.3 var(--velox-font-sans);color:var(--velox-text-dim);margin-top:2px}
  .hex{margin-left:auto;font:500 11px/1 var(--velox-font-mono);color:var(--velox-text-dim)}
</style>
</head><body>
  <div class="label">Text · 3-step ladder</div>
  <div class="stack">
    <div class="row"><div class="swatch" style="background:#e6ebf3"></div><div><div class="role" style="color:#e6ebf3">text — primary</div><div class="desc">Headings, body, active states</div></div><div class="hex">#E6EBF3</div></div>
    <div class="row"><div class="swatch" style="background:#98a2b3"></div><div><div class="role" style="color:#98a2b3">text-dim — secondary</div><div class="desc">Labels, meta, inactive nav</div></div><div class="hex">#98A2B3</div></div>
    <div class="row"><div class="swatch" style="background:#6b7280"></div><div><div class="role" style="color:#6b7280">text-faint — tertiary</div><div class="desc">Placeholders, empty state</div></div><div class="hex">#6B7280</div></div>
  </div>
</body></html>
