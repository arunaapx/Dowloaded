<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0c1220;font-family:var(--velox-font-sans);color:var(--velox-text);overflow:hidden;height:100vh}
  body{padding:18px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(60% 50% at 8% 0%,rgba(108,196,255,.10),transparent 60%);pointer-events:none}
  .lib{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(28,32,44,.72);border:1px solid rgba(255,255,255,.08);border-radius:10px;backdrop-filter:blur(20px);position:relative}
  .th{width:56px;height:40px;background:linear-gradient(135deg,#2a3145,#1a1f30);border-radius:6px;flex-shrink:0;display:grid;place-items:center;color:#6b7280}
  .th svg{width:18px;height:18px}
  .info{flex:1;min-width:0}
  .ti{font:600 13px/1.2 var(--velox-font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font:400 11px/1.3 var(--velox-font-sans);color:#98a2b3;margin-top:2px}
  .acts{display:flex;gap:4px}
  .g{background:transparent;border:1px solid rgba(255,255,255,.08);color:#98a2b3;padding:6px 12px;border-radius:8px;font:400 12px/1 var(--velox-font-sans);cursor:pointer}
</style>
</head><body>
  <div class="lib">
    <div class="th"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6"/><path d="M10 9l5 3-5 3V9z" fill="currentColor"/></svg></div>
    <div class="info"><div class="ti">Big Buck Bunny — Trailer (HD)</div><div class="sub">1080p · 11 May 2026, 4:12 PM</div></div>
    <div class="acts"><button class="g">Open</button><button class="g">Folder</button></div>
  </div>
  <div class="lib">
    <div class="th" style="background:linear-gradient(135deg,#1d3a2b,#0f1f17);color:#6ee7a3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M9 18V6l12-2v12"/></svg></div>
    <div class="info"><div class="ti">Lo-Fi Beats to Code To · Mix vol. 3</div><div class="sub">MP3 192 · 11 May 2026, 3:48 PM</div></div>
    <div class="acts"><button class="g">Open</button><button class="g">Folder</button></div>
  </div>
  <div class="lib">
    <div class="th"></div>
    <div class="info"><div class="ti">Tutorial: Setting up a new Macbook in 2026</div><div class="sub">720p · 11 May 2026, 1:02 PM</div></div>
    <div class="acts"><button class="g">Open</button><button class="g">Folder</button></div>
  </div>
</body></html>
