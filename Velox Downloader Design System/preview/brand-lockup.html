<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0c1220;font-family:var(--velox-font-sans);color:var(--velox-text);overflow:hidden;height:100vh}
  body{padding:18px 22px;box-sizing:border-box;display:flex;align-items:center;gap:22px}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(50% 60% at 10% 0%,rgba(108,196,255,.12),transparent 60%);pointer-events:none}
  .lockup{display:flex;align-items:center;gap:14px;position:relative}
  .tile{width:64px;height:64px;border-radius:14px;background:var(--velox-grad-logo);display:grid;place-items:center;box-shadow:var(--velox-shadow-logo)}
  .tile svg{width:36px;height:36px;color:white}
  .name{font:600 22px/1.1 var(--velox-font-sans)}
  .ver{font:400 14px/1 var(--velox-font-sans);color:var(--velox-text-dim);margin-left:6px}
  .tag{font:500 12px/1 var(--velox-font-sans);color:var(--velox-text-dim);margin-top:6px;letter-spacing:.04em}
  .swatches{display:flex;gap:6px;margin-left:auto;position:relative}
  .sw{width:32px;height:64px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
</style>
</head><body>
  <div class="lockup">
    <div class="tile">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7v10l10 5 10-5V7L12 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8 10l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="name">Velox Downloader<span class="ver">v2.1</span></div>
      <div class="tag">Desktop · Extension · yt-dlp</div>
    </div>
  </div>
  <div class="swatches">
    <div class="sw" style="background:#6cc4ff"></div>
    <div class="sw" style="background:#4ea8ff"></div>
    <div class="sw" style="background:#a78bfa"></div>
    <div class="sw" style="background:#1c202c"></div>
    <div class="sw" style="background:#e6ebf3"></div>
  </div>
</body></html>
