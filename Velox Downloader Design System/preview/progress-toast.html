<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0c1220;font-family:var(--velox-font-sans);color:var(--velox-text);overflow:hidden;height:100vh}
  body{padding:24px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(60% 50% at 8% 0%,rgba(108,196,255,.10),transparent 60%);pointer-events:none}
  .row{position:relative}
  .lbl{font:500 10px/1 var(--velox-font-sans);text-transform:uppercase;letter-spacing:.08em;color:var(--velox-text-faint);margin-bottom:8px}
  .bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#6cc4ff,#4ea8ff);box-shadow:0 0 8px rgba(108,196,255,.4)}
  .fill.done{background:linear-gradient(90deg,#6ee7a3,#4ade80)}
  .fill.err{background:linear-gradient(90deg,#ff7a8a,#fb7185)}
  .toast{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(28,32,44,.96);border:1px solid rgba(255,255,255,.12);border-radius:10px;font:500 13px/1 var(--velox-font-sans);box-shadow:0 12px 32px rgba(0,0,0,.55);backdrop-filter:blur(14px)}
  .toast.ok{border-color:rgba(34,197,94,.45)}
  .toast.err{border-color:rgba(239,68,68,.45)}
  .toast .dot{width:8px;height:8px;border-radius:50%}
</style>
</head><body>
  <div class="row">
    <div class="lbl">Progress bar · downloading 62%</div>
    <div class="bar"><div class="fill" style="width:62%"></div></div>
  </div>
  <div class="row">
    <div class="lbl">Progress bar · done</div>
    <div class="bar"><div class="fill done" style="width:100%"></div></div>
  </div>
  <div class="row">
    <div class="lbl">Progress bar · error</div>
    <div class="bar"><div class="fill err" style="width:34%"></div></div>
  </div>
  <div class="row" style="display:flex;gap:12px;flex-wrap:wrap">
    <div class="toast ok"><span class="dot" style="background:#22c55e"></span>Sent to Velox · MP3 · 192 kbps</div>
    <div class="toast err"><span class="dot" style="background:#ef4444"></span>Velox app not running</div>
  </div>
</body></html>
