<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#0c1220;font-family:var(--velox-font-sans);color:var(--velox-text);overflow:hidden;height:100vh}
  body{padding:18px 22px;box-sizing:border-box}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(60% 50% at 8% 0%,rgba(108,196,255,.10),transparent 60%);pointer-events:none}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;margin-bottom:12px}
  .lbl{font:600 10px/1 var(--velox-font-sans);text-transform:uppercase;letter-spacing:.08em;color:var(--velox-text-dim);width:90px;flex-shrink:0}
  .demo{display:flex;align-items:center;justify-content:center;background:rgba(108,196,255,.6);font:500 11px/1 var(--velox-font-mono);color:#0c1220}
  .demo.outline{background:transparent;color:var(--velox-text-dim);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
</style>
</head><body>
  <div class="row"><div class="lbl">Radius</div>
    <div class="demo outline" style="width:46px;height:46px;border-radius:4px">4</div>
    <div class="demo outline" style="width:46px;height:46px;border-radius:6px">6</div>
    <div class="demo outline" style="width:46px;height:46px;border-radius:8px">8</div>
    <div class="demo outline" style="width:46px;height:46px;border-radius:10px">10</div>
    <div class="demo outline" style="width:46px;height:46px;border-radius:14px">14</div>
    <div class="demo outline" style="width:80px;height:36px;border-radius:999px">999</div>
  </div>
  <div class="row"><div class="lbl">Spacing</div>
    <div class="demo" style="width:4px;height:18px"></div>
    <div class="demo" style="width:6px;height:18px"></div>
    <div class="demo" style="width:8px;height:18px"></div>
    <div class="demo" style="width:12px;height:18px"></div>
    <div class="demo" style="width:14px;height:18px"></div>
    <div class="demo" style="width:18px;height:18px"></div>
    <div class="demo" style="width:22px;height:18px"></div>
    <div class="demo" style="width:26px;height:18px"></div>
    <div style="font:500 11px/1 var(--velox-font-mono);color:var(--velox-text-faint);margin-left:8px">4 · 6 · 8 · 12 · 14 · 18 · 22 · 26</div>
  </div>
</body></html>
