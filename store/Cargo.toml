[package]
name = "velox-store"
version = "0.1.0"
edition = "2021"
description = "Velox Downloader store API - PayPal checkout, licence issuing, download counter."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
base64 = "0.22"
rand = "0.8"

[profile.release]
opt-level = 2
strip = true
