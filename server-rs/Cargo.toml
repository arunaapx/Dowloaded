[package]
name = "velox-license"
version = "0.1.0"
edition = "2021"
# Two binaries live here: the service, and the one-off import tool. Naming the
# default keeps `cargo run` unambiguous.
default-run = "velox-license"
description = "Velox Downloader licence server - keys, devices, plans, notices and gated extraction."

[dependencies]
# Same stack as store/, so there is one set of idioms across the two services.
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "trace"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The licence data. SQLite rather than the JSON file the Node server keeps:
# same single-file deployment, but with real transactions, so a crash halfway
# through issuing a key cannot leave a half-written ledger.
rusqlite = { version = "0.32", features = ["bundled"] }

jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
opt-level = 2
strip = true
