# veloxdownloader.prolanka.online - public store site + admin editor.
#
#   sudo cp deploy/nginx-veloxdownloader.conf /etc/nginx/sites-available/veloxdownloader
#   sudo ln -s /etc/nginx/sites-available/veloxdownloader /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d veloxdownloader.prolanka.online
#
# This is a SEPARATE subdomain from the licence server (downloader.prolanka.online),
# which keeps its own server block on port 4000. The two never share a vhost.

server {
    listen 80;
    server_name veloxdownloader.prolanka.online;

    root /opt/velox/site/dist;
    index index.html;

    # The React build is hashed and immutable; index.html must never be cached
    # or visitors keep loading an old bundle after you deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The installer. Put the built .exe here:
    #   sudo mkdir -p /opt/velox/downloads
    #   sudo cp "dist/Velox Downloader 2.1.0.exe" /opt/velox/downloads/VeloxDownloader.exe
    location /download/ {
        alias /opt/velox/downloads/;
        add_header Content-Disposition "attachment";
        # Installers are large; don't let a slow client time out mid-transfer.
        proxy_read_timeout 300s;
    }

    # Auto-update feed for the desktop app (electron-updater, generic provider).
    # Put each release here:
    #   sudo mkdir -p /opt/velox/updates
    #   sudo cp dist/latest.yml dist/VeloxDownloader-Setup-*.exe dist/*.blockmap /opt/velox/updates/
    #
    # No Content-Disposition here on purpose: the updater fetches these itself,
    # and it needs byte ranges for the differential download to work.
    # latest.yml is how a client learns a release exists, so it must never be
    # served stale. The exact match wins over the prefix location below.
    location = /updates/latest.yml {
        alias /opt/velox/updates/latest.yml;
        add_header Cache-Control "no-cache";
    }
    location /updates/ {
        alias /opt/velox/updates/;
        proxy_read_timeout 300s;
    }

    # The pricing tiers, read from the licence server (its own vhost, port
    # 4010) so the website and the desktop app can never disagree about a
    # price: both read the list an admin published in one panel. Exact match,
    # so everything else under /api/ still belongs to the store service below.
    location = /api/plans {
        proxy_pass http://127.0.0.1:4010/api/plans;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Store API - PayPal checkout, content, download counter, admin.
    location /api/store/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # /internal/* on the licence server must never be reachable from outside.
    # It is bound to loopback and token-guarded already; this is the third lock.
    location /internal/ { return 404; }

    # Single-page app: /Admin and every other path resolve to index.html so the
    # React router in main.jsx can decide what to show.
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 256k;   # the site only ever posts JSON

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
