# Velox nginx site config — license + extraction server (the Windows thin-client backend).
#
# Put this at /etc/nginx/sites-available/velox, then:
#   sudo ln -s /etc/nginx/sites-available/velox /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.com        # adds the SSL (443) block + HTTP->HTTPS redirect
#
# Replace your-domain.com with your real domain. The Windows app then points at
# LICENSE_SERVER_URL=https://your-domain.com
#
# (The optional web PWA is a separate app on :8080 — host it on its own
#  subdomain with a second server block; don't share /api with this server.)

server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 64k;        # client only sends URLs + options

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # usage.js IP tracking needs this
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;     # extraction can take a few seconds
    }
}
