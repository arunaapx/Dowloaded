# downloader.prolanka.online — the licence and extraction server.
#
# ── THIS FILE IS THE LIVE CONFIG ──────────────────────────────────────────────
# It is symlinked into place:
#
#   /etc/nginx/sites-enabled/velox -> /opt/velox/deploy/nginx-velox.conf
#
# so a `git pull` on the VPS rewrites nginx's configuration, and the change goes
# live at the next reload — which certbot does on its own timer, without anyone
# asking for it. That is not theoretical: this file was once the generic template
# shipped with the repo (server_name your-domain.com, proxy to :4000), a pull
# replaced the real vhost with it, and for a day the only thing keeping every
# customer's app working was that nginx had not been reloaded yet. The next
# certificate renewal would have sent them all to another product's front end.
#
# So: change this file the way you would change production, and reload
# deliberately after checking it:
#
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -s https://downloader.prolanka.online/healthz
#
# The Windows app points at https://downloader.prolanka.online — the desktop app,
# the admin panel and the website's pricing all arrive through here.

server {
    listen 80;
    server_name downloader.prolanka.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name downloader.prolanka.online;

    # An explicit server_name beats the *.prolanka.online wildcard block, which
    # would otherwise catch this host and serve a different product entirely.
    # That is the whole reason this block exists rather than relying on the
    # wildcard.

    # The wildcard certificate covers this host; there is no separate one for it.
    ssl_certificate     /etc/letsencrypt/live/prolanka-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prolanka-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The app sends links and options, which are tiny. The one large body is a
    # cookies.txt pasted into the admin panel; a real export runs to a few
    # hundred kilobytes.
    client_max_body_size 512k;

    # The route the store service calls when a payment is captured. It is for
    # this machine only, and it is closed here because the licence server cannot
    # tell a proxied request from a local one by socket address alone: behind a
    # proxy every request arrives from 127.0.0.1. Left open, the token would be
    # the only thing standing between the internet and a free licence.
    location /internal/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The audit log and the per-address limits read this. Without it every
        # customer in the world shares one line of the log.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reading a link takes a few seconds, and a long playlist takes longer.
        proxy_read_timeout 120s;
    }
}
